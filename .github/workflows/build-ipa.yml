name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "Capacitor 8 requires Xcode 26.0 or newer; found $XCODE_VERSION"
            exit 1
          fi

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build offline web bundle
        run: npm run build:web

      - name: Generate native iOS project
        run: npx cap add ios --packagemanager SPM

      - name: Sync Capacitor assets
        run: npx cap sync ios

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          plutil -lint "$APP_PATH/Info.plist"
          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/BeamNGStudio.app
          cd package
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/BeamNG-Texture-Editor-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          test -s BeamNG-Texture-Editor-unsigned.ipa
          unzip -t BeamNG-Texture-Editor-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamNG-Texture-Editor-unsigned-IPA
          path: BeamNG-Texture-Editor-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
