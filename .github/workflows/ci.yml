name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate required app files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s manifest.webmanifest
          test -s sw.js
      - name: Check HTML document structure
        run: |
          grep -q '<html lang="ar" dir="rtl">' index.html
          grep -q 'id="editorCanvas"' index.html
          grep -q 'id="searchInput"' index.html